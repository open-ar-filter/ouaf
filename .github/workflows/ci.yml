name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests, build, schema (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build playground
        run: npm run build

      - name: Published JSON Schema is up to date
        run: |
          npm run build:schema
          git diff --exit-code -- docs/spec packages/spec/schema \
            || (echo "::error::The JSON Schema is out of date: run 'npm run build:schema' and commit the result." && exit 1)

  coverage:
    name: Unit test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests with coverage
        run: npm run test:coverage

      - name: Coverage summary
        run: |
          node -e '
            const total = require("./coverage/coverage-summary.json").total
            const rows = ["lines", "statements", "functions", "branches"]
              .map((k) => `| ${k} | ${total[k].pct} % | ${total[k].covered} / ${total[k].total} |`)
            console.log(["### Unit test coverage", "", "| | % | covered |", "|---|---|---|", ...rows].join("\n"))
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  browser:
    name: Browser tests (Chromium, test clips, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # The tests run one at a time and mostly wait on real-time clip playback: four machines divide the wall time by
    # about four, while each test still has a machine to itself (timing-sensitive tests are not slowed down).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache the face model
        uses: actions/cache@v6
        with:
          path: apps/playground/models
          key: models-${{ hashFiles('apps/playground/scripts/fetch-models.ts') }}

      - name: Download the face model
        run: npm run fetch-models

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser -- --shard=${{ matrix.shard }}/4

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7


  security:
    name: Malicious filters (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # The suite of SECURITY.md (#27): every filter of filters/evil/ must fail, on each browser engine. Chromium is not
    # in this matrix: the browser tests above already run e2e/evil.spec.ts on it (the `chromium` project runs every
    # spec), a job here would only run it a second time.
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache the face model
        uses: actions/cache@v6
        with:
          path: apps/playground/models
          key: models-${{ hashFiles('apps/playground/scripts/fetch-models.ts') }}

      - name: Download the face model
        run: npm run fetch-models

      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Malicious filters
        # Under a virtual display: headless Firefox has no WebGL on Linux, so it runs headed (playwright.config.ts).
        run: xvfb-run -a npm run test:security -- --project=${{ matrix.browser }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-security-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
