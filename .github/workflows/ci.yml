name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests, build, schema (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build playground
        run: npm run build

      - name: Published JSON Schema is up to date
        run: |
          npm run build:schema
          git diff --exit-code -- docs/spec packages/spec/schema \
            || (echo "::error::The JSON Schema is out of date: run 'npm run build:schema' and commit the result." && exit 1)

  coverage:
    name: Unit test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests with coverage
        run: npm run test:coverage

      - name: Coverage summary
        run: |
          node -e '
            const total = require("./coverage/coverage-summary.json").total
            const rows = ["lines", "statements", "functions", "branches"]
              .map((k) => `| ${k} | ${total[k].pct} % | ${total[k].covered} / ${total[k].total} |`)
            console.log(["### Unit test coverage", "", "| | % | covered |", "|---|---|---|", ...rows].join("\n"))
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  browser:
    name: Browser tests (Chromium, test clips, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # The tests run one at a time and mostly wait on real-time clip playback: four machines divide the wall time by
    # about four, while each test still has a machine to itself (timing-sensitive tests are not slowed down).
    # The groups are made by hand from the durations of the spec files on CI, 4 to 5 minutes each: Playwright's `--shard`
    # splits by number of tests, which left one machine with 2 minutes of tests and another with 6. The last group
    # takes every file the others do not name, so a new spec file runs without being added here; a file moved to
    # another group must be added to that list too (else it only runs twice).
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            tests: device-adaptation.spec.ts preview.spec.ts script.spec.ts sources.spec.ts
          - shard: 2
            tests: tracking.spec.ts occlusion.spec.ts
          - shard: 3
            tests: litert-tracker.spec.ts demos.spec.ts shader.spec.ts package.spec.ts warp.spec.ts
          - shard: 4
            tests: --grep-invert "(evil|device-adaptation|preview|script|sources|tracking|occlusion|litert-tracker|demos|shader|package|warp)\.spec\.ts"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache the face model
        uses: actions/cache@v6
        with:
          path: apps/playground/models
          key: models-${{ hashFiles('apps/playground/scripts/fetch-models.ts') }}

      - name: Download the face model
        run: npm run fetch-models

      # The browser comes from a cache when the lockfile (hence Playwright's version) has not changed; the system
      # packages are installed apart, so that a slow step says which of the two it was.
      - name: Cache Chromium
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium's system packages
        run: npx playwright install-deps chromium

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Browser tests
        run: npm run test:browser -- ${{ matrix.tests }}
        env:
          # Each test records the engine code it runs (e2e/coverage/); the `browser-coverage` job adds the groups up.
          OUAF_COVERAGE: 1

      - name: Upload recorded coverage
        uses: actions/upload-artifact@v7
        with:
          name: browser-coverage-raw-${{ matrix.shard }}
          path: coverage-browser/raw/
          retention-days: 1

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  browser-coverage:
    name: Browser test coverage
    # The Chromium job of `security` records coverage too: the malicious filters suite runs there only.
    needs: [browser, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the coverage recorded by every shard
        uses: actions/download-artifact@v8
        with:
          pattern: browser-coverage-raw-*
          path: coverage-browser/raw/
          merge-multiple: true

      - name: Coverage report
        # Fails when the modules only the browser can run are below the threshold (e2e/coverage/browser-only.ts).
        run: npm run coverage:browser

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const rows = (total) => ["lines", "statements", "functions", "branches"]
              .map((k) => `| ${k} | ${total[k].pct} % | ${total[k].covered} / ${total[k].total} |`)
            const head = ["", "| | % | covered |", "|---|---|---|"]
            const only = require("./coverage-browser/browser-only-summary.json")
            console.log([
              `### Browser test coverage: browser-only modules (threshold ${only.threshold} %)`, ...head, ...rows(only.total), "",
              "### Browser test coverage: every file the browser loaded (no threshold)", ...head,
              ...rows(require("./coverage-browser/coverage-summary.json").total),
            ].join("\n"))
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-browser
          path: |
            coverage-browser/
            !coverage-browser/raw/
          retention-days: 14


  security:
    name: Malicious filters (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # The suite of SECURITY.md (#27): every filter of filters/evil/ must fail, on each browser engine. It runs here
    # only: `npm run test:browser` leaves e2e/evil.spec.ts out.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache the face model
        uses: actions/cache@v6
        with:
          path: apps/playground/models
          key: models-${{ hashFiles('apps/playground/scripts/fetch-models.ts') }}

      - name: Download the face model
        run: npm run fetch-models

      - name: Cache ${{ matrix.browser }}
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the system packages of ${{ matrix.browser }}
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Install ${{ matrix.browser }}
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install ${{ matrix.browser }}

      - name: Malicious filters
        # Under a virtual display: headless Firefox has no WebGL on Linux, so it runs headed (playwright.config.ts).
        run: xvfb-run -a npm run test:security -- --project=${{ matrix.browser }}
        env:
          # Recorded on Chromium only (e2e/fixtures.ts): its share of the browser coverage, as the suite runs here only.
          OUAF_COVERAGE: 1

      - name: Upload recorded coverage
        if: matrix.browser == 'chromium'
        uses: actions/upload-artifact@v7
        with:
          name: browser-coverage-raw-security
          path: coverage-browser/raw/
          retention-days: 1

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-security-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
