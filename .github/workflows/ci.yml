name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests, build, schema (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build playground
        run: npm run build

      - name: Published JSON Schema is up to date
        run: |
          npm run build:schema
          git diff --exit-code -- docs/spec packages/spec/schema \
            || (echo "::error::The JSON Schema is out of date: run 'npm run build:schema' and commit the result." && exit 1)

  browser:
    name: Browser tests (Chromium, test clips)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache the face model
        uses: actions/cache@v6
        with:
          path: apps/playground/models
          key: models-${{ hashFiles('apps/playground/scripts/fetch-models.ts') }}

      - name: Download the face model
        run: npm run fetch-models

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

